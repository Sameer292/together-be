services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: together_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:54328:5432"
    volumes:
      - together_pgdata:/var/lib/postgresql/data
      - ./docker/init-local.sql:/docker-entrypoint-initdb.d/init-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d together_dev"]
      interval: 2s
      retries: 20
volumes:
  together_pgdata:
